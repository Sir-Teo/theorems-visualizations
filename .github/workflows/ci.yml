name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build (fails on content errors)
        run: node scripts/build.mjs --strict
      - name: Static checks
        run: node scripts/check.mjs --static --quiet
      - name: Unit tests
        run: if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then npm test; fi
      - name: Page smoke test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/smoke.mjs
      - name: Visualizations in changed chapters
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/check.mjs --changed=origin/${{ github.base_ref || 'main' }} --quiet
