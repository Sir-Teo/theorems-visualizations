<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas human review</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body{display:block;margin:0;padding:24px;max-width:1600px;margin-inline:auto}h1{font-size:30px;margin:0 0 8px}p{max-width:90ch}button,input,select,textarea{font:inherit}button,select,input{padding:8px}button{cursor:pointer}a{color:var(--accent,#385bd0)}
    .toolbar,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar{margin:20px 0}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px}.queue{max-height:78vh;overflow:auto;display:flex;flex-direction:column;gap:6px}.queue button{text-align:left;border:1px solid var(--line,#bbb);background:var(--panel,#fff);color:inherit;border-radius:6px}.queue button[aria-current=true]{outline:2px solid var(--accent,#385bd0);outline-offset:-2px}.queue small{display:block}.workspace{min-width:0}.review-panel{border:1px solid var(--line,#bbb);padding:16px;border-radius:8px;margin-bottom:16px}fieldset{margin:12px 0;min-width:0}fieldset label{display:block;margin:8px 0}textarea{width:100%;min-height:72px;padding:8px;box-sizing:border-box}iframe{width:100%;height:950px;border:1px solid var(--line,#bbb);background:white;border-radius:8px}#message{min-height:1.5em}#progress{font-weight:600}.muted,small{color:var(--muted,#666)}input[type=checkbox]{margin-right:8px}#name{max-width:220px}.queue button,.review-panel{overflow-wrap:anywhere}@media(max-width:700px){body{padding:12px}.layout{grid-template-columns:1fr}.queue{max-height:210px}iframe{height:900px}}
  </style>
</head>
<body>
  <h1>Atlas human review</h1>
  <p>Review the visual sample and listen to the audio examples. Test the controls, compare the explanation with the picture, and record any misleading or unreadable result. Listening starts inside an example when you press its sound control.</p>
  <p id="progress" aria-live="polite">Loading the review sample…</p>
  <div class="toolbar">
    <label>Reviewer <input id="name" autocomplete="name" placeholder="Your name"></label>
    <label>Queue <select id="queue"><option value="visual">Visual sample</option><option value="audio">Listening</option><option value="all">All entries</option></select></label>
    <label><input id="pending" type="checkbox">Only unfinished</label>
    <button id="export" type="button">Export reviews</button>
    <label>Import reviews <input id="import" type="file" accept="application/json,.json"></label>
  </div>
  <p id="message" role="status"></p>
  <div class="layout">
    <nav class="queue" id="items" aria-label="Review entries"></nav>
    <main class="workspace">
      <div id="review" class="review-panel"></div>
      <iframe id="example" title="Selected interactive explanation" loading="lazy"></iframe>
    </main>
  </div>
  <script type="module" src="./human-review.js"></script>
</body>
</html>
